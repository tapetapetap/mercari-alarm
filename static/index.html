<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메르카리 알림</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메르카리 알림">
<meta name="theme-color" content="#e8453c">
<style>
  :root { --bg:#f6f6f7; --card:#fff; --text:#1b1b1f; --muted:#6b6b76; --line:#e3e3e8; --accent:#e8453c; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1d1d21; --text:#ececf1; --muted:#9a9aa6; --line:#2e2e35; --err:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; font-size: 16px; color: var(--text);
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  button { min-height: 44px; min-width: 44px; padding: 0 16px; font-size: 16px; border: 0; border-radius: 10px;
           cursor: pointer; }
  .add { background: var(--accent); color: #fff; font-weight: 600; }
  #error { color: var(--err); font-size: 14px; min-height: 21px; margin: 6px 2px 10px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .del { background: transparent; color: var(--muted); }
  .empty { padding: 16px 14px; color: var(--muted); }
  .count { color: var(--muted); font-size: 13px; margin: 8px 2px 0; text-align: right; }
</style>
</head>
<body>
<main>
  <h1>메르카리 알림</h1>
  <p class="sub">키워드에 맞는 새 상품이 올라오면 ntfy로 알려 드려요. 추가한 키워드는 그 뒤에 올라온 상품부터 알립니다.</p>
  <form id="form">
    <input id="kw" maxlength="50" placeholder="예: ポケモンカード 151 BOX" autocomplete="off" enterkeyhint="done" aria-label="새 키워드">
    <button class="add" type="submit">추가</button>
  </form>
  <div id="error" role="alert"></div>
  <ul id="list"></ul>
  <p class="count" id="count"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);

function render(keywords, max) {
  const list = $("list");
  list.replaceChildren();
  if (!keywords.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "등록된 키워드가 없습니다.";
    list.append(li);
  }
  for (const k of keywords) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = k;  // textContent만 사용 (FR-013)
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "삭제";
    del.setAttribute("aria-label", k + " 삭제");
    del.onclick = () => call("DELETE", "/api/keywords?keyword=" + encodeURIComponent(k));
    li.append(span, del);
    list.append(li);
  }
  $("count").textContent = keywords.length + " / " + max;
}

async function call(method, url, body) {
  $("error").textContent = "";
  try {
    const res = await fetch(url, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "요청 실패 (" + res.status + ")");
    render(data.keywords, data.max);
    return true;
  } catch (e) {
    // fetch 자체가 실패하면 TypeError (문구는 브라우저마다 다름: Failed to fetch / Load failed / NetworkError)
    $("error").textContent = e instanceof TypeError ? "알림기 PC에 연결할 수 없습니다" : e.message;
    return false;
  }
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (await call("POST", "/api/keywords", { keyword: $("kw").value })) $("kw").value = "";
};

call("GET", "/api/keywords");
</script>
</body>
</html>
